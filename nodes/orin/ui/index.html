<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>NanoBot Control</title>

<style>
* { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
body {
    font-family: sans-serif;
    background: #111;
    color: white;
    text-align: center;
}

#video {
    width: 960px;
    max-width: 95%;
    background: black;
}

.panel {
    margin: 20px;
}

button {
    width: 70px;
    height: 50px;
    margin: 5px;
    font-size: 20px;
}

.status {
    margin: 10px;
}
</style>

</head>

<body>

<h1>NanoBot</h1>

<div class="status">
<div id="status-conn">Connecting...</div>
<div id="status-drive">Drive idle</div>
<div id="status-pt">PT idle</div>
</div>


<video id="video" autoplay playsinline></video>


<div class="panel">

<h2>Speed</h2>

<input id="speed-slider"
type="range"
min="0"
max="100"
value="50">

</div>


<div class="panel" id="drive-pad">

<h2>Drive</h2>

<div>
<button class="dpad-btn" data-cmd="fwd">▲</button>
</div>

<div>
<button class="dpad-btn" data-cmd="left">◀</button>
<button class="dpad-btn" data-cmd="back">▼</button>
<button class="dpad-btn" data-cmd="right">▶</button>
</div>

</div>


<div class="panel" id="pantilt-pad">

<h2>Camera</h2>

<div>
<button class="dpad-btn" data-cmd="pt_up">▲</button>
</div>

<div>
<button class="dpad-btn" data-cmd="pt_left">◀</button>
<button class="dpad-btn" data-cmd="pt_down">▼</button>
<button class="dpad-btn" data-cmd="pt_right">▶</button>
</div>

</div>


<button id="estop">
E-STOP
</button>


<script>
// ── WebRTC setup ──
let pc = null;
let dc = null;

async function connect() {
  setStatus('conn', '🟡 Connecting…');
  pc = new RTCPeerConnection();

  pc.addTransceiver("video", { direction: "recvonly" });

  pc.ontrack = (event) => {
    document.getElementById("video").srcObject = event.streams[0];
  };

  dc = pc.createDataChannel('control'); 

  dc.onopen  = () => setStatus('conn', '🟢 Connected');
  dc.onclose = () => { setStatus('conn', '🔴 Disconnected'); setTimeout(connect, 3000); };
  dc.onmessage = e => {
    const msg = JSON.parse(e.data);
    if (msg.event === 'estop') setStatus('drive', msg.active ? 'Drive: E-STOP' : 'Drive: idle');
  };

  pc.oniceconnectionstatechange = () => {
    if (['disconnected','failed','closed'].includes(pc.iceConnectionState))
      setTimeout(connect, 3000);
  };

  const offer  = await pc.createOffer();
  await pc.setLocalDescription(offer);

  const resp   = await fetch('http://192.168.4.90:8080/offer', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ sdp: offer.sdp, type: offer.type }),
  });
  const answer = await resp.json();
  await pc.setRemoteDescription(answer);
}

function send(obj) {
  if (dc && dc.readyState === 'open') dc.send(JSON.stringify(obj));
}

function setStatus(key, text) {
  const map = { conn:'status-conn', drive:'status-drive', pt:'status-pt' };
  const el = document.getElementById(map[key]);
  if (el) el.textContent = text;
}

// ── Drive command map ──
const speed = () => parseInt(document.getElementById('speed-slider').value) / 100;

const DRIVE_CMDS = {
  fwd:   () => ({ cmd:'drive', throttle:  speed(), steering:  0.0 }),
  back:  () => ({ cmd:'drive', throttle: -speed(), steering:  0.0 }),
  left:  () => ({ cmd:'drive', throttle:  speed() * 0.3, steering: -speed() }),
  right: () => ({ cmd:'drive', throttle:  speed() * 0.3, steering:  speed() }),
};

// ── Speed readout ──
const speedSlider = document.getElementById('speed-slider');
const speedReadout = document.getElementById('speed-readout');
speedSlider.addEventListener('input', () => {
  speedReadout.textContent = speedSlider.value + '%';
});

// ── Drive D-pad ──
// ── Drive D-pad ──
let driveTimer = null;

document.getElementById('drive-pad').querySelectorAll('.dpad-btn').forEach(btn => {
  const cmd = btn.dataset.cmd;

  const sendDrive = () => {
    const payload = DRIVE_CMDS[cmd] ? DRIVE_CMDS[cmd]() : null;
    if (payload) {
      send(payload);
      setStatus('drive', 'Drive: ' + cmd);
    }
  };

  const press = e => {
    e.preventDefault();
    btn.classList.add('pressed');

    sendDrive();

    if (driveTimer) clearInterval(driveTimer);
    driveTimer = setInterval(sendDrive, 100);
  };

  const release = e => {
    e.preventDefault();
    btn.classList.remove('pressed');

    if (driveTimer) {
      clearInterval(driveTimer);
      driveTimer = null;
    }

    send({ cmd: 'stop' });
    setStatus('drive', 'Drive: idle');
  };

  btn.addEventListener('pointerdown', press);
  btn.addEventListener('pointerup', release);
  btn.addEventListener('pointerleave', release);
});

// ── Pan-tilt D-pad ──
const PT_CMDS = {
  pt_up:    { cmd:'nudge_tilt', value:  5 },
  pt_down:  { cmd:'nudge_tilt', value: -5 },
  pt_left:  { cmd:'nudge_pan',  value: -5 },
  pt_right: { cmd:'nudge_pan',  value:  5 },
};

document.getElementById('pantilt-pad').querySelectorAll('.dpad-btn[data-cmd]').forEach(btn => {
  const cmd = btn.dataset.cmd;
  const press = e => {
    e.preventDefault(); btn.classList.add('pressed');
    if (PT_CMDS[cmd]) { send(PT_CMDS[cmd]); setStatus('pt', 'PT: ' + cmd); }
  };
  const release = e => {
    e.preventDefault(); btn.classList.remove('pressed');
    setStatus('pt', 'PT: idle');
  };
  btn.addEventListener('pointerdown',  press);
  btn.addEventListener('pointerup',    release);
  btn.addEventListener('pointerleave', release);
});

// ── E-STOP ──
document.getElementById('estop').addEventListener('pointerdown', e => {
  e.preventDefault();
  send({ cmd: 'estop' });
  setStatus('drive', 'Drive: E-STOP');
});
document.getElementById('estop').addEventListener('pointerup', e => {
  document.getElementById('estop').classList.remove('pressed');
});

connect();
</script>

</body>
</html>
