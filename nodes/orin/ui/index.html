<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>NanoBot Control</title>

<style>
* { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
body {
    font-family: sans-serif;
    background: #111;
    color: white;
    text-align: center;
}

#video {
    width: 960px;
    max-width: 95%;
    background: black;
}

.panel {
    margin: 20px;
}

button {
    width: 70px;
    height: 50px;
    margin: 5px;
    font-size: 20px;
}

.status {
    margin: 10px;
}

#joy-base, #cam-base {
    position: relative;
    box-sizing: border-box;
    width: 160px;
    height: 160px;
    margin: 15px auto;
    border-radius: 50%;
    background: #222;
    border: 2px solid #555;
    touch-action: none;
}
#joy-knob, #cam-knob {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 60px;
    height: 60px;
    margin: -30px 0 0 -30px;
    border-radius: 50%;
    background: #4a8;
    pointer-events: none;
}

#controls-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: flex-start;
    gap: 40px;
}
#pantilt-pad { order: 1; }
#drive-pad   { order: 2; }
#tag-readout {
    font-family: monospace;
    font-size: 14px;
    margin: 10px;
}
</style>

</head>

<body>

<h1>NanoBot</h1>

<div class="status">
<div id="status-conn">Connecting...</div>
<div id="status-drive">Drive idle</div>
<div id="status-pt">PT idle</div>
</div>


<video id="video" autoplay playsinline></video>

<div class="panel" id="tag-panel">
<h2>AprilTags</h2>
<div id="tag-readout">Waiting for status...</div>
</div>


<div class="panel">

<h2>Speed</h2>

<input id="speed-slider"
type="range"
min="0"
max="100"
value="50">

<span id="speed-readout">50%</span>

</div>


<div id="controls-row">
<div class="panel" id="drive-pad">

<h2>Drive</h2>




<div id="joy-base"><div id="joy-knob"></div></div>
</div>


<div class="panel" id="pantilt-pad">

<h2>Camera</h2>

<div id="cam-base"><div id="cam-knob"></div></div>

</div>
</div>


<button id="estop">
E-STOP
</button>


<script>
// ── WebRTC setup ──
let pc = null;
let dc = null;
let reconnectTimer = null;
let connecting = false;

function scheduleReconnect() {
  if (reconnectTimer !== null || connecting) return;
  reconnectTimer = setTimeout(() => {
    reconnectTimer = null;
    connect();
  }, 3000);
}

async function connect() {
  if (connecting) return;
  connecting = true;

  if (pc) {
    pc.oniceconnectionstatechange = null;
    pc.ontrack = null;
    try { pc.close(); } catch (_) {}
    pc = null;
  }

  setStatus('conn', '🟡 Connecting…');

  const currentPc = new RTCPeerConnection();
  pc = currentPc;

  currentPc.addTransceiver("video", { direction: "recvonly" });

  currentPc.ontrack = (event) => {
    document.getElementById("video").srcObject = event.streams[0];
  };

  const currentDc = currentPc.createDataChannel('control');
  dc = currentDc;

  currentDc.onopen = () => setStatus('conn', '🟢 Connected');

  currentDc.onclose = () => {
    if (pc !== currentPc) return;
    setStatus('conn', '🔴 Disconnected');
    scheduleReconnect();
  };

  currentDc.onmessage = e => {
    const msg = JSON.parse(e.data);
    if (msg.event === 'estop') setStatus('drive', msg.active ? 'Drive: E-STOP' : 'Drive: idle');
  };

  currentPc.oniceconnectionstatechange = () => {
    if (pc !== currentPc) return;
    if (['disconnected','failed','closed'].includes(currentPc.iceConnectionState)) {
      scheduleReconnect();
    }
  };

  try {
    const offer = await currentPc.createOffer();
    await currentPc.setLocalDescription(offer);

    const resp = await fetch('http://192.168.4.90:8080/offer', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sdp: offer.sdp, type: offer.type }),
    });
    const answer = await resp.json();
    await currentPc.setRemoteDescription(answer);
  } finally {
    connecting = false;
  }
}

function send(obj) {
  if (dc && dc.readyState === 'open') dc.send(JSON.stringify(obj));
}

function setStatus(key, text) {
  const map = { conn:'status-conn', drive:'status-drive', pt:'status-pt' };
  const el = document.getElementById(map[key]);
  if (el) el.textContent = text;
}

// -- AprilTag readout (read-only, polls /status) --
const TAG_POLL_MS = 250;
const tagReadout = document.getElementById('tag-readout');
const fmt = (v, d) => (typeof v === 'number' ? v.toFixed(d) : '--');

function showTagLines(lines) {
  tagReadout.textContent = '';
  for (const t of lines) {
    const row = document.createElement('div');
    row.textContent = t;
    tagReadout.appendChild(row);
  }
}

async function pollTags() {
  try {
    const resp = await fetch('/status', { cache: 'no-store' });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const a = (await resp.json()).apriltag;
    if (!a || !a.worker_alive) {
      showTagLines(['AprilTag worker not running']);
    } else if (a.error) {
      showTagLines(['AprilTag error: ' + a.error]);
    } else if (!a.detected || !a.tags || a.tags.length === 0) {
      showTagLines(['No tag in view']);
    } else {
      showTagLines(a.tags.map(t =>
        `ID ${t.tag_id} | dist ${fmt(t.distance_m, 2)} m | ` +
        `x ${fmt(t.x_m, 2)} y ${fmt(t.y_m, 2)} z ${fmt(t.z_m, 2)} | ` +
        `margin ${fmt(t.decision_margin, 1)} | ham ${t.hamming}`));
    }
  } catch (e) {
    showTagLines(['AprilTag status unavailable (' + e.message + ')']);
  }
  setTimeout(pollTags, TAG_POLL_MS);
}
pollTags();

// ── Speed slider value (0-1) ──
const speed = () => parseInt(document.getElementById('speed-slider').value) / 100;

// ── Speed readout ──
const speedSlider = document.getElementById('speed-slider');
const speedReadout = document.getElementById('speed-readout');
speedSlider.addEventListener('input', () => {
  speedReadout.textContent = speedSlider.value + '%';
});

// -- Joysticks (shared makeStick) --
const JOY_DEADZONE  = 0.10;   // fraction of knob travel
const JOY_SEND_MS   = 100;    // send interval while a stick is held
const JOY_MAX_INPUT = 0.50;   // drive.py _shape() saturates at 0.50
const CAM_MAX_DEG_S = 22;     // camera speed at full deflection; keep <= SLEW_RATE_DEG_S (120) in servo.py
const CAM_CURVE     = 2.0;    // 1 = linear; higher = finer control near center (full deflection speed unchanged)
const CAM_PAN_SIGN  = -1;     // -1 = stick right pans camera right (pan servo is mirrored); set to 1 to reverse
const camCurve = v => Math.sign(v) * Math.pow(Math.abs(v), CAM_CURVE);

function makeStick(base, onTick, onRelease) {
  const knob = base.firstElementChild;
  let pointer = null, x = 0, y = 0, timer = null;

  function move(e) {
    const rect = base.getBoundingClientRect();
    const travel = (rect.width - knob.offsetWidth) / 2;
    let dx = (e.clientX - (rect.left + rect.width / 2)) / travel;
    let dy = (e.clientY - (rect.top + rect.height / 2)) / travel;
    let mag = Math.hypot(dx, dy);
    if (mag > 1) { dx /= mag; dy /= mag; mag = 1; }
    knob.style.transform = `translate(${dx * travel}px, ${dy * travel}px)`;
    if (mag < JOY_DEADZONE) {
      x = 0; y = 0;
    } else {
      const k = (mag - JOY_DEADZONE) / (1 - JOY_DEADZONE) / mag;
      x = dx * k;
      y = -dy * k;            // screen Y is down-positive
    }
  }

  function end(e) {
    if (e.pointerId !== pointer) return;
    pointer = null; x = 0; y = 0;
    knob.style.transform = '';
    if (timer) { clearInterval(timer); timer = null; }
    onRelease();
  }

  base.addEventListener('pointerdown', e => {
    if (pointer !== null) return;
    e.preventDefault();
    pointer = e.pointerId;
    base.setPointerCapture(e.pointerId);
    move(e);
    onTick(x, y);
    timer = setInterval(() => onTick(x, y), JOY_SEND_MS);
  });
  base.addEventListener('pointermove', e => {
    if (e.pointerId === pointer) move(e);
  });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t =>
    base.addEventListener(t, end));
}

// Drive stick: throttle/steering scaled by the speed slider, capped at JOY_MAX_INPUT
makeStick(document.getElementById('joy-base'),
  (x, y) => {
    const limit = Math.min(speed(), JOY_MAX_INPUT);
    const p = { cmd: 'drive', throttle: y * limit, steering: x * limit };
    send(p);
    setStatus('drive', `Drive: joy t=${p.throttle.toFixed(2)} s=${p.steering.toFixed(2)}`);
  },
  () => {
    send({ cmd: 'stop' });
    setStatus('drive', 'Drive: idle');
  });

// Camera stick: rate control. Repeated nudges while held; the camera stays put on release.
makeStick(document.getElementById('cam-base'),
  (x, y) => {
    const step = CAM_MAX_DEG_S * JOY_SEND_MS / 1000;
    const px = CAM_PAN_SIGN * camCurve(x) * step, py = camCurve(y) * step;
    if (px !== 0) send({ cmd: 'nudge_pan',  value: px });
    if (py !== 0) send({ cmd: 'nudge_tilt', value: py });
    setStatus('pt', `PT: pan ${px.toFixed(1)} tilt ${py.toFixed(1)}`);
  },
  () => {
    setStatus('pt', 'PT: idle');
  });

// ── E-STOP ──
document.getElementById('estop').addEventListener('pointerdown', e => {
  e.preventDefault();
  send({ cmd: 'estop' });
  setStatus('drive', 'Drive: E-STOP');
});
document.getElementById('estop').addEventListener('pointerup', e => {
  document.getElementById('estop').classList.remove('pressed');
});

connect();
</script>

</body>
</html>
